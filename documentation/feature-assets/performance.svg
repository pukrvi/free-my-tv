<g id="disclosure">
<text x="80" y="974" fill="#ADB3B8" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400">Historical snapshots, not a controlled three-way benchmark. Reboot and cache state affect memory.</text>
