<g id="metric-labels">
<text x="660" y="338" fill="#ADB3B8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">HOME RESPONSE / ms / lower is better</text>
<text x="1260" y="338" fill="#ADB3B8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="400">AVAILABLE MEMORY / MiB / higher is better</text>
