<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" role="img"><title>Three measured performance states with explicit units and snapshot caveats</title><desc>Evidence-led Vibe TV feature scene. Editable vector text and shapes with embedded raster evidence.</desc><rect width="1920" height="1080" fill="#101214"/>
<g id="brand">
<text x="80" y="80" fill="#F5F5F4" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700">VIBE TV</text>
